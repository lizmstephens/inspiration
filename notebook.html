<main>
 <div class="stage" id="journal-stage"><div id="book" aria-label="Interactive discovery notebook"></div></div>
 <div class="controls"><button id="prev" aria-label="Previous page" disabled>‹</button><div id="page-label" aria-live="polite">Opening notebook…</div><button id="next" aria-label="Next page" disabled>›</button></div>
</main>
<script>
(function(){
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=u=>{try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?esc(x.href):'#'}catch(e){return '#'}};
const date=s=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
const root=document.getElementById('book');
const label=document.getElementById('page-label'),prev=document.getElementById('prev'),next=document.getElementById('next');
let flip=null,pages=[],all=[],current=0;
function page(html,kind='',hard=false){return '<article class="page '+kind+'" '+(hard?'data-density="hard"':'')+'><div class="page-inner '+(kind==='coverpage'?'cover':'')+'">'+(kind==='coverpage'?'':'<img class="page-logo" src="assets/favicon.svg" alt="" aria-hidden="true">')+html+'</div></article>'}
function foot(number,kind){return ''}
function thoughtsTitle(name){let n=String(name||'Contributor').trim().split(/\s+/)[0];return esc(n)+(n.toLowerCase().endsWith('s')?'’':'’s')+' Thoughts'}
function build(x){
 let pieces=[];
 pieces.push(page('<img src="assets/journal.png" class="journal-cover-art" alt="Leather notebook cover embossed with a hummingbird" draggable="false">','coverpage',true));
 const img=x.image?'<figure class="paper-photo"><img src="'+link(x.image)+'" alt="Image accompanying '+esc(x.title)+'" loading="lazy"><figcaption class="photo-credit">'+(x.image_credit_url?'<a href="'+link(x.image_credit_url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.image_credit||'Image source')+'</a>':esc(x.image_credit||''))+(x.image_license_url?' · <a href="'+link(x.image_license_url)+'" target="_blank" rel="noopener noreferrer">Licence</a>':'')+'</figcaption></figure>':'';
 const tags=(x.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
 let sources=(x.sources&&x.sources.length?x.sources:[{url:x.source}]).filter(a=>a.url);
 pieces.push(page('<div class="eyebrow">'+esc(date(x.date))+'</div><h2>'+esc(x.title)+'</h2><div class="tags">'+tags+'</div>'+img+'<div class="copy"><p>'+esc(x.summary)+'</p></div><div class="story-links">'+sources.map(z=>'<a href="'+link(z.url)+'" target="_blank" rel="noopener noreferrer">Read original story ↗</a>').join(' · ')+'</div>'+foot('01','The discovery'),'story'));
 const reflections=[{name:'AI Reflection',text:x.discovery||x.summary},{name:'Liz’s Thoughts',text:x.thoughts}];
 (x.reflections||[]).filter(c=>c&&c.approved===true&&c.name&&c.text).forEach(c=>reflections.push({name:thoughtsTitle(c.name),text:c.text}));
 reflections.filter(r=>r.text&&String(r.text).trim()).forEach((r,i)=>{pieces.push(page('<div class="eyebrow">A different perspective · '+String(i+1).padStart(2,'0')+'</div><h2 class="reflection-head">'+esc(r.name)+'</h2><div class="copy"><p>'+esc(r.text)+'</p></div>'+foot(String(i+2).padStart(2,'0'),r.name),'reflection'))});
 pieces.push(page('<div class="eyebrow">The end · For now</div><h2>Where might this idea lead?</h2><p>Every reflection is a different way of looking at the same discovery.</p><p><a href="archive.html">Explore the archive ↗</a></p><p>Return tomorrow for another discovery.</p>','endpage',true));
 return pieces;
}
function update(){
 if(!flip)return;
 current=flip.getCurrentPageIndex();const total=flip.getPageCount();
 label.textContent=current===0?'Cover · Open the notebook':(current===total-1?'Last page':('Page '+current+' of '+(total-2)));
 prev.disabled=current===0;next.disabled=current>=total-1;
 document.getElementById('journal-stage').classList.toggle('open-book',current>0&&current<total-1);
 
}
function render(x){
 if(flip){flip.destroy();flip=null}
 root.classList.remove('fallback');document.getElementById('journal-stage').classList.remove('open-book');root.innerHTML=build(x).join('');
 if(!window.St||!window.St.PageFlip){
   root.classList.add('fallback');label.textContent='Notebook pages (animation unavailable)';prev.disabled=true;next.disabled=true;return;
 }
 try{
  flip=new St.PageFlip(root,{width:430,height:590,size:'stretch',minWidth:285,maxWidth:490,minHeight:405,maxHeight:680,maxShadowOpacity:.3,showCover:true,usePortrait:true,drawShadow:true,flippingTime:700,autoSize:true,mobileScrollSupport:true,clickEventForward:true});
  flip.on('flip',update);flip.on('changeOrientation',update);
  flip.loadFromHTML(root.querySelectorAll('.page'));root.querySelectorAll('.copy').forEach(el=>{el.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});el.addEventListener('touchmove',e=>e.stopPropagation(),{passive:true});el.addEventListener('wheel',e=>e.stopPropagation(),{passive:true})});update();
 }catch(err){console.error(err);root.classList.add('fallback');label.textContent='Read the notebook pages below';prev.disabled=true;next.disabled=true}
}
prev.addEventListener('click',()=>flip&&flip.flipPrev());
next.addEventListener('click',()=>flip&&flip.flipNext());
document.addEventListener('keydown',e=>{if(!flip||e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight')flip.flipNext();if(e.key==='ArrowLeft')flip.flipPrev()});

fetch('inspiration.json').then(r=>{if(!r.ok)throw Error('Could not load discoveries');return r.json()}).then(data=>{
 all=data.slice().sort((a,b)=>b.date.localeCompare(a.date));
 const param=new URLSearchParams(location.search).get('id');const chosen=all.find(x=>x.id===param)||all[0];render(chosen);
}).catch(err=>{console.error(err);label.textContent='Unable to load discoveries';root.innerHTML='<p class="fallback-message">The discovery data could not be loaded. Please refresh the page.</p>'});
})();
</script>
</body></html>
