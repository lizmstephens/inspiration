<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10243d"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Notebook experiment · Daily Hummingbird</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10243d;--ink:#172942;--cream:#fff8e9;--gold:#ffe0a0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#223b58,var(--navy) 75%);color:white;font-family:'DM Sans',Arial,sans-serif;min-height:100vh}
a{color:inherit}button,select{font:inherit}button{cursor:pointer}
.top{max-width:1120px;margin:0 auto;padding:23px 24px 8px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{font-size:clamp(23px,3.3vw,37px);font-weight:700;text-decoration:none;letter-spacing:-.045em}.brand em{color:#ffe18f;font-style:normal}
.top nav{display:flex;gap:19px;font-size:14px}.top nav a{text-decoration:none;opacity:.85}.top nav a:hover{text-decoration:underline}
.intro{text-align:center;max-width:790px;margin:0 auto;padding:6px 24px 10px}.intro p{color:#e4dfd4;font-size:15px;line-height:1.6;margin:3px 0}
.chapters{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px auto 0;flex-wrap:wrap}
.chapters label{font-size:13px;color:#e6dbb9}select{max-width:min(80vw,390px);border:1px solid #9a9fa5;color:white;border-radius:18px;padding:9px 32px 9px 13px;background:#203b57}
.stage{position:relative;max-width:1100px;margin:8px auto 0;min-height:610px;display:flex;align-items:center;justify-content:center;padding:15px}
#book{width:100%;max-width:1000px;margin:auto}#book .page{background:#faf2df;color:var(--ink);border:1px solid #d9c9ae;overflow:hidden}
.page-inner{height:100%;padding:clamp(23px,3vw,39px);position:relative;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fffdf2,#faf1db 80%);}
.page-inner:before{content:"";position:absolute;pointer-events:none;inset:11px;border:1px solid rgba(165,125,60,.11)}
.page .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#78674d;font-weight:700;margin-bottom:13px}
.page h2{font-family:Fraunces,Georgia,serif;font-size:clamp(25px,3vw,38px);line-height:1.12;letter-spacing:-.025em;margin:0 0 14px}
.page .scribble{font-size:14px;font-style:italic;color:#675b4d;background:linear-gradient(transparent 55%,#ffe3a2 55%);align-self:flex-start;margin-bottom:14px}
.page .copy{font:400 clamp(15px,1.5vw,17px)/1.62 Georgia,serif;overflow-y:auto;min-height:0;scrollbar-width:thin;padding-right:4px}
.page .copy p{margin:0 0 14px}.page .copy p:first-child{font-weight:600}
.page .page-foot{font-size:11px;color:#7e705d;border-top:1px solid #e0d4c0;padding-top:9px;margin-top:auto;display:flex;justify-content:space-between;gap:10px}
.page .cover{background:linear-gradient(145deg,#294766,#132840 75%);color:#fff1c5;justify-content:center;align-items:center;text-align:center;border:13px solid #273f56;box-shadow:inset 0 0 0 2px #a78a56,inset 0 0 0 18px #182f4b}
.page .cover:before{inset:27px;border:1px solid #907951}.cover .bigbrand{font:600 clamp(38px,4vw,56px)/1.13 Fraunces,Georgia,serif;letter-spacing:-.035em;max-width:90%}.cover .cover-small{font-size:12px;letter-spacing:.23em;text-transform:uppercase;margin-bottom:24px}.cover .cover-ornament{font-size:60px;margin:14px 0;color:#f6cf79}.cover .cover-tail{font-size:14px;max-width:260px;line-height:1.5}
.paper-photo{margin:2px 0 13px;padding:7px;background:#fff;box-shadow:0 3px 10px #49371c25;transform:rotate(-1deg)}
.paper-photo img{width:100%;height:clamp(95px,17vw,165px);object-fit:cover;display:block}.photo-credit{font-size:10px;color:#746b5c;line-height:1.3;margin-top:5px}.photo-credit a{color:#314767}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tag{font-size:11px;color:#344555;background:#e7eddb;border-radius:15px;padding:4px 8px}
.story-links{font-size:13px;margin-top:12px}.story-links a{color:#243e60;font-weight:700}
.reflection-head{border-bottom:4px solid #f3dda7;padding-bottom:7px;align-self:flex-start}
.reflection .copy{margin-top:24px;font-size:clamp(17px,1.6vw,20px);line-height:1.68}
.doodle{position:absolute;bottom:53px;right:26px;color:#aa8650;font-size:27px;opacity:.85;pointer-events:none}
.endpage{text-align:center;justify-content:center;align-items:center;gap:15px}.endpage h2{font-size:35px}.endpage p{line-height:1.6;font-family:Georgia,serif}.endpage a{color:#183a5d}
.controls{max-width:880px;margin:5px auto 25px;padding:0 25px;display:flex;gap:15px;align-items:center;justify-content:center}
.controls button{height:45px;width:45px;background:transparent;color:#ffe4a1;border:1px solid #d6ba79;border-radius:50%;font-size:24px}
.controls button:hover{background:#ffffff1e}.controls button:disabled{opacity:.3;cursor:not-allowed}
#page-label{min-width:205px;text-align:center;color:#f5e8c4;font-size:14px}
.bird{position:absolute;top:0;left:calc(50% + 340px);width:63px;height:45px;pointer-events:none;transition:transform .5s,opacity .5s;z-index:10}
.bird svg{width:100%;height:100%}.bird.jump{transform:translateY(-17px) rotate(-8deg)}
.fallback{max-width:650px;margin:15px auto;padding:0 20px}.fallback .page{display:block;margin:0 0 20px;min-height:460px;border-radius:8px}.fallback .page-inner{min-height:460px}.fallback-message{color:#eee;max-width:600px;margin:0 auto 15px}
@media(max-width:700px){.top{padding:16px 20px;display:block;text-align:center}.top nav{justify-content:center;margin-top:12px;flex-wrap:wrap}.intro p{font-size:13px}.stage{min-height:480px;padding:12px 4px}.bird{left:auto;right:15px;top:4px;width:44px}.controls{margin-top:10px}.page .page-inner{padding:23px}.page .copy{font-size:15px}.reflection .copy{font-size:17px}.paper-photo img{height:120px}}
@media(prefers-reduced-motion:reduce){.bird{transition:none}}

/* Notebook experiment: everyday worn leather on a warm coffee-shop table.
   Entirely CSS-based, with no generated or remotely loaded background image. */
body{
 background-color:#805336;
 background-image:
   linear-gradient(90deg,rgba(41,24,13,.28) 0 1px,transparent 2px 100%),
   repeating-linear-gradient(94deg,transparent 0 18px,rgba(54,29,15,.09) 19px 21px,transparent 24px 47px,rgba(245,200,136,.07) 50px 52px),
   repeating-linear-gradient(0deg,rgba(48,27,15,.12) 0 2px,transparent 3px 170px,rgba(35,21,12,.23) 171px 175px,rgba(225,175,111,.12) 177px 179px,transparent 180px 355px),
   radial-gradient(ellipse at 50% 6%,rgba(249,202,137,.48),transparent 70%),
   linear-gradient(95deg,#623c26,#996742 25%,#805031 52%,#a67349 78%,#68432c);
 background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%;
}
body:before{content:"";pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(33,20,12,.22));z-index:0}
body>header,body>.intro,body>.chapters,body>main{position:relative;z-index:1}
.top{background:rgba(31,27,26,.13);border-radius:0 0 12px 12px}
.intro p,.chapters label{color:#fff4e7;text-shadow:0 1px 3px #301b13}
.chapters select{background:#59402f;border-color:#c5a788}
.stage{filter:drop-shadow(0 22px 20px rgba(26,13,8,.43))}
#book .page{background:#f8f7f0;border-color:#ddd9cb}
.page-inner{
 background-color:#f9f8f2;
 background-image:
   repeating-linear-gradient(to bottom,transparent 0,transparent 30px,rgba(111,143,158,.15) 31px,transparent 32px),
   linear-gradient(115deg,rgba(255,255,255,.86),rgba(246,243,232,.65));
 background-size:100% 32px,100% 100%;
}
.page-inner:before{border-color:rgba(107,124,125,.07)}
.page .cover{
 background-color:#70513f;
 background-image:
   repeating-linear-gradient(92deg,rgba(35,22,17,.035) 0 1px,transparent 2px 5px),
   radial-gradient(circle at 80% 12%,rgba(242,205,160,.12),transparent 50%),
   radial-gradient(circle at 20% 90%,rgba(40,25,19,.21),transparent 52%),
   linear-gradient(118deg,#604433,#81624a 42%,#634a3a 85%);
 color:#c7ad87;
 border:9px solid #674b38;
 border-radius:19px;
 box-shadow:
   inset 0 0 0 1px rgba(255,226,179,.21),
   inset 11px 0 15px rgba(45,28,20,.28),
   inset -3px 1px 9px rgba(41,24,17,.2);
}
#book .coverpage{border-radius:20px;overflow:hidden;border:1px solid #483125}
.page .cover:before{inset:12px;border:1px dashed rgba(218,184,139,.37);border-radius:12px}
.cover .bigbrand{
 color:#b89a73;
 font:600 clamp(34px,4vw,51px)/1.2 Fraunces,Georgia,serif;
 letter-spacing:-.045em;
 text-shadow:0 1px 1px rgba(241,205,156,.25),0 -1px 1px rgba(34,21,15,.7);
 transform:rotate(-2deg);
}
.controls button{background:#684730b0;border-color:#efd4a8;color:#fff0d3}
.controls button:hover{background:#4b3025}
#page-label{color:#fff6e6;text-shadow:0 1px 3px #3b2113}
@media(max-width:700px){.stage{filter:drop-shadow(0 12px 12px rgba(26,13,8,.4))}}

/* Photo-backed journal experiment: keep the working StPageFlip mechanism. */
body{
 background-color:#a77955;
 background-image:linear-gradient(rgba(79,53,33,.12),rgba(79,53,33,.14)),url('https://unsplash.com/photos/XnpWqPZNfXE/download?force=true&w=1800');
 background-position:center center;
 background-size:cover;
 background-repeat:no-repeat;
 background-attachment:fixed;
}
body:before{background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(45,26,15,.16));}
.top{background:rgba(42,32,24,.25);backdrop-filter:blur(2px)}
.stage{filter:drop-shadow(0 20px 22px rgba(36,19,11,.4))}
#book .coverpage{border:0!important;border-radius:22px 15px 15px 22px!important;background:#664532;overflow:hidden;box-shadow:3px 6px 0 #4c3225,8px 14px 15px #28180c77}
.page .cover{background:none!important;border:0!important;border-radius:inherit!important;box-shadow:none!important;padding:0!important}
.page .cover:before{content:none!important}
.journal-cover-art{display:block;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none}
#book .page:not(.coverpage){background:#f9f8f2;border-color:#e0dacd}
.page-inner:not(.cover){
 background-color:#faf9f3;
 background-image:repeating-linear-gradient(to bottom,transparent 0 29px,rgba(114,145,166,.17) 30px,transparent 31px),linear-gradient(105deg,#fffdf8,#f7f5ee);
 background-size:100% 31px,100% 100%;
}
.page-inner:not(.cover):before{border-color:rgba(113,111,105,.06)}
.controls button{background:rgba(74,48,32,.7);border-color:#eee0c6;color:#fff2df}
#page-label{color:#fff8ea;text-shadow:0 1px 3px #3e2418}
@media(max-width:700px){body{background-attachment:scroll}}
/* Reliable locally served tabletop; no external hotlink redirects. */
body{background-color:#c9a17d!important;background-image:url('assets/wood-table.svg')!important;background-position:center!important;background-size:cover!important;background-repeat:no-repeat!important;background-attachment:fixed!important}
@media(max-width:700px){body{background-attachment:scroll!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js" defer></script>
</head>
<body>
<header class="top"><a class="brand" href="index.html">Daily <em>Hummingbird</em></a><nav aria-label="Site navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="archive.html">Archive</a><a href="collaborators.html">Collaborators</a></nav></header>
<section class="intro"><p><strong>The notebook experiment</strong> — open the cover and flick through a discovery and the different perspectives it inspired. Drag a page corner, swipe, or use the arrows.</p></section>
<div class="chapters"><label for="discovery">Discoveries</label><select id="discovery" aria-label="Choose a discovery"><option>Loading…</option></select></div>
<main>
 <div class="stage"><div class="bird" id="bird" aria-hidden="true"><svg viewBox="0 0 110 75"><path fill="#ffe3a0" stroke="#152b43" stroke-width="2" d="M55 42C37 30 21 19 4 5c23 1 42 10 57 20L42 2c24 10 36 23 40 37L108 30 86 48 68 49 45 72 53 47z"/><circle cx="81" cy="34" r="3" fill="#152b43"/></svg></div><div id="book" aria-label="Interactive discovery notebook"></div></div>
 <div class="controls"><button id="prev" aria-label="Previous page" disabled>‹</button><div id="page-label" aria-live="polite">Opening notebook…</div><button id="next" aria-label="Next page" disabled>›</button></div>
</main>
<script>
(function(){
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=u=>{try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?esc(x.href):'#'}catch(e){return '#'}};
const date=s=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
const root=document.getElementById('book'),picker=document.getElementById('discovery');
const label=document.getElementById('page-label'),prev=document.getElementById('prev'),next=document.getElementById('next'),bird=document.getElementById('bird');
let flip=null,pages=[],all=[],current=0;
function page(html,kind='',hard=false){return '<article class="page '+kind+'" '+(hard?'data-density="hard"':'')+'><div class="page-inner '+(kind==='coverpage'?'cover':'')+'">'+html+'</div></article>'}
function foot(number,kind){return '<div class="page-foot"><span>Daily Hummingbird · '+esc(kind)+'</span><span>'+number+'</span></div>'}
function thoughtsTitle(name){let n=String(name||'Contributor').trim().split(/\s+/)[0];return esc(n)+(n.toLowerCase().endsWith('s')?'’':'’s')+' Thoughts'}
function build(x){
 let pieces=[];
 pieces.push(page('<img src="assets/journal.png" class="journal-cover-art" alt="Leather notebook cover embossed with a hummingbird" draggable="false">','coverpage',true));
 const img=x.image?'<figure class="paper-photo"><img src="'+link(x.image)+'" alt="Image accompanying '+esc(x.title)+'" loading="lazy"><figcaption class="photo-credit">'+(x.image_credit_url?'<a href="'+link(x.image_credit_url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.image_credit||'Image source')+'</a>':esc(x.image_credit||''))+(x.image_license_url?' · <a href="'+link(x.image_license_url)+'" target="_blank" rel="noopener noreferrer">Licence</a>':'')+'</figcaption></figure>':'';
 const tags=(x.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
 let sources=(x.sources&&x.sources.length?x.sources:[{url:x.source}]).filter(a=>a.url);
 pieces.push(page('<div class="eyebrow">'+esc(date(x.date))+' · Discovery</div><h2>'+esc(x.title)+'</h2><div class="tags">'+tags+'</div>'+img+'<div class="copy"><p>'+esc(x.summary)+'</p></div><div class="story-links">'+sources.map(z=>'<a href="'+link(z.url)+'" target="_blank" rel="noopener noreferrer">Read original story ↗</a>').join(' · ')+'</div>'+foot('01','The discovery'),'story'));
 const reflections=[{name:'AI Reflection',text:x.discovery||x.summary},{name:'Liz’s Thoughts',text:x.thoughts}];
 (x.reflections||[]).filter(c=>c&&c.approved===true&&c.name&&c.text).forEach(c=>reflections.push({name:thoughtsTitle(c.name),text:c.text}));
 reflections.filter(r=>r.text&&String(r.text).trim()).forEach((r,i)=>{pieces.push(page('<div class="eyebrow">A different perspective · '+String(i+1).padStart(2,'0')+'</div><h2 class="reflection-head">'+esc(r.name)+'</h2><div class="copy"><p>'+esc(r.text)+'</p></div><span class="doodle" aria-hidden="true">✳</span>'+foot(String(i+2).padStart(2,'0'),r.name),'reflection'))});
 pieces.push(page('<div class="eyebrow">The end · For now</div><h2>Where might this idea lead?</h2><p>Every reflection is a different way of looking at the same discovery.</p><p><a href="archive.html">Explore the archive ↗</a></p><p>Or choose another discovery above.</p>','endpage',true));
 return pieces;
}
function update(){
 if(!flip)return;
 current=flip.getCurrentPageIndex();const total=flip.getPageCount();
 label.textContent=current===0?'Cover · Open the notebook':(current===total-1?'Last page':('Page '+current+' of '+(total-2)));
 prev.disabled=current===0;next.disabled=current>=total-1;
 bird.classList.remove('jump');void bird.offsetWidth;bird.classList.add('jump');
}
function render(x){
 if(flip){flip.destroy();flip=null}
 root.classList.remove('fallback');root.innerHTML=build(x).join('');
 if(!window.St||!window.St.PageFlip){
   root.classList.add('fallback');label.textContent='Notebook pages (animation unavailable)';prev.disabled=true;next.disabled=true;bird.style.display='none';return;
 }
 try{
  flip=new St.PageFlip(root,{width:430,height:590,size:'stretch',minWidth:285,maxWidth:490,minHeight:405,maxHeight:680,maxShadowOpacity:.3,showCover:true,usePortrait:true,drawShadow:true,flippingTime:700,autoSize:true,mobileScrollSupport:false,clickEventForward:true});
  flip.on('flip',update);flip.on('changeOrientation',update);
  flip.loadFromHTML(root.querySelectorAll('.page'));update();
 }catch(err){console.error(err);root.classList.add('fallback');label.textContent='Read the notebook pages below';prev.disabled=true;next.disabled=true}
}
prev.addEventListener('click',()=>flip&&flip.flipPrev());
next.addEventListener('click',()=>flip&&flip.flipNext());
document.addEventListener('keydown',e=>{if(!flip||e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight')flip.flipNext();if(e.key==='ArrowLeft')flip.flipPrev()});
picker.addEventListener('change',()=>{const x=all.find(y=>y.id===picker.value);if(x)render(x)});
fetch('inspiration.json').then(r=>{if(!r.ok)throw Error('Could not load discoveries');return r.json()}).then(data=>{
 all=data.slice().sort((a,b)=>b.date.localeCompare(a.date));picker.innerHTML=all.map(x=>'<option value="'+esc(x.id)+'">'+esc(date(x.date))+' — '+esc(x.title)+'</option>').join('');
 const param=new URLSearchParams(location.search).get('id');const chosen=all.find(x=>x.id===param)||all[0];picker.value=chosen.id;render(chosen);
}).catch(err=>{console.error(err);label.textContent='Unable to load discoveries';root.innerHTML='<p class="fallback-message">The discovery data could not be loaded. Please refresh the page.</p>'});
})();
</script>
</body></html>
