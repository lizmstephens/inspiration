<style>
:root{--navy:#10243d;--ink:#172942;--cream:#fff8e9;--gold:#ffe0a0}

.top{max-width:1120px;margin:0 auto;padding:23px 24px 8px;display:flex;justify-content:space-between;align-items:center;gap:24px}

.stage{position:relative;max-width:1100px;margin:8px auto 0;min-height:610px;display:flex;align-items:center;justify-content:center;padding:15px}
#book{width:100%;max-width:1000px;margin:auto}#book .page{background:#faf2df;color:var(--ink);border:1px solid #d9c9ae;overflow:hidden}
.page-inner{height:100%;padding:clamp(23px,3vw,39px);position:relative;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fffdf2,#faf1db 80%);}

.page .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#78674d;font-weight:700;margin-bottom:13px}

.page .scribble{font-size:14px;font-style:italic;color:#675b4d;background:linear-gradient(transparent 55%,#ffe3a2 55%);align-self:flex-start;margin-bottom:14px}
.page .copy{font:400 clamp(15px,1.5vw,17px)/1.62 Georgia,serif;overflow-y:auto;min-height:0;scrollbar-width:thin;padding-right:4px}
.page .copy p{margin:0 0 14px}.page .copy p:first-child{font-weight:600}
.page .page-foot{font-size:11px;color:#7e705d;border-top:1px solid #e0d4c0;padding-top:9px;margin-top:auto;display:flex;justify-content:space-between;gap:10px}
.page .cover{background:linear-gradient(145deg,#294766,#132840 75%);color:#fff1c5;justify-content:center;align-items:center;text-align:center;border:13px solid #273f56;box-shadow:inset 0 0 0 2px #a78a56,inset 0 0 0 18px #182f4b}
.page .cover:before{inset:27px;border:1px solid #907951}.cover .bigbrand{font:600 clamp(38px,4vw,56px)/1.13 Fraunces,Georgia,serif;letter-spacing:-.035em;max-width:90%}.cover .cover-small{font-size:12px;letter-spacing:.23em;text-transform:uppercase;margin-bottom:24px}.cover .cover-ornament{font-size:60px;margin:14px 0;color:#f6cf79}.cover .cover-tail{font-size:14px;max-width:260px;line-height:1.5}
.paper-photo{margin:2px 0 13px;padding:7px;background:#fff;box-shadow:0 3px 10px #49371c25;transform:rotate(-1deg)}
.paper-photo img{width:100%;height:clamp(95px,17vw,165px);object-fit:cover;display:block}.photo-credit{font-size:10px;color:#746b5c;line-height:1.3;margin-top:5px}.photo-credit a{color:#314767}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tag{font-size:11px;color:#344555;background:#e7eddb;border-radius:15px;padding:4px 8px}
.story-links{font-size:13px;margin-top:12px}.story-links a{color:#243e60;font-weight:700}
.reflection-head{border-bottom:4px solid #f3dda7;padding-bottom:7px;align-self:flex-start}
.reflection .copy{margin-top:24px;font-size:clamp(17px,1.6vw,20px);line-height:1.68}
.doodle{position:absolute;bottom:53px;right:26px;color:#aa8650;font-size:27px;opacity:.85;pointer-events:none}
.endpage{text-align:center;justify-content:center;align-items:center;gap:15px}.endpage h2{font-size:35px}.endpage p{line-height:1.6;font-family:Georgia,serif}.endpage a{color:#183a5d}
.controls{max-width:880px;margin:5px auto 25px;padding:0 25px;display:flex;gap:15px;align-items:center;justify-content:center}

.controls button:hover{background:#ffffff1e}.controls button:disabled{opacity:.3;cursor:not-allowed}
#page-label{min-width:205px;text-align:center;color:#f5e8c4;font-size:14px}
.bird{position:absolute;top:0;left:calc(50% + 340px);width:63px;height:45px;pointer-events:none;transition:transform .5s,opacity .5s;z-index:10}
.bird svg{width:100%;height:100%}.bird.jump{transform:translateY(-17px) rotate(-8deg)}
.fallback{max-width:650px;margin:15px auto;padding:0 20px}.fallback .page{display:block;margin:0 0 20px;min-height:460px;border-radius:8px}.fallback .page-inner{min-height:460px}.fallback-message{color:#eee;max-width:600px;margin:0 auto 15px}

/* Notebook experiment: everyday worn leather on a warm coffee-shop table.
   Entirely CSS-based, with no generated or remotely loaded background image. */
body{
 background-color:#805336;
 background-image:
   linear-gradient(90deg,rgba(41,24,13,.28) 0 1px,transparent 2px 100%),
   repeating-linear-gradient(94deg,transparent 0 18px,rgba(54,29,15,.09) 19px 21px,transparent 24px 47px,rgba(245,200,136,.07) 50px 52px),
   repeating-linear-gradient(0deg,rgba(48,27,15,.12) 0 2px,transparent 3px 170px,rgba(35,21,12,.23) 171px 175px,rgba(225,175,111,.12) 177px 179px,transparent 180px 355px),
   radial-gradient(ellipse at 50% 6%,rgba(249,202,137,.48),transparent 70%),
   linear-gradient(95deg,#623c26,#996742 25%,#805031 52%,#a67349 78%,#68432c);
 background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%;
}
body:before{content:"";pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(33,20,12,.22));z-index:0}
body>header,body>.intro,body>.chapters,body>main{position:relative;z-index:1}
.top{background:rgba(31,27,26,.13);border-radius:0 0 12px 12px}
.intro p,.chapters label{color:#fff4e7;text-shadow:0 1px 3px #301b13}
.chapters select{background:#59402f;border-color:#c5a788}
.stage{filter:drop-shadow(0 22px 20px rgba(26,13,8,.43))}
#book .page{background:#f8f7f0;border-color:#ddd9cb}
.page-inner{

   repeating-linear-gradient(to bottom,transparent 0,transparent 30px,rgba(111,143,158,.15) 31px,transparent 32px),
   linear-gradient(115deg,rgba(255,255,255,.86),rgba(246,243,232,.65));
 background-size:100% 32px,100% 100%;
}
.page-inner:before{border-color:rgba(107,124,125,.07)}

}
#book .coverpage{border-radius:20px;overflow:hidden;border:1px solid #483125}
.page .cover:before{inset:12px;border:1px dashed rgba(218,184,139,.37);border-radius:12px}
.cover .bigbrand{
 color:#b89a73;
 font:600 clamp(34px,4vw,51px)/1.2 Fraunces,Georgia,serif;
 letter-spacing:-.045em;
 text-shadow:0 1px 1px rgba(241,205,156,.25),0 -1px 1px rgba(34,21,15,.7);
 transform:rotate(-2deg);
}

 });

 sectionPages.about=pieces.length;
 const aboutHtml='<h2>About Daily Hummingbird</h2><div class="copy about-copy">'+"\n        <p>\n          I'm Liz Stephens,\n          <a href=\"https://research.reading.ac.uk/meteorology/people/liz-stephens/\" target=\"_blank\" rel=\"noopener noreferrer\">\n            Professor of Climate Risks and Resilience at the University of Reading\n          </a>\n          , in a joint role with the Red Cross Red Crescent Climate Centre.\n        </p>\n        <p>\n          I spend much of my professional life thinking about climate risk, forecasting and how scientific information can be put to use. Though I'm a scientist by background, I find myself most energised and inspired by engaging with people and ideas from many different backgrounds.\n        </p>\n        <p>\n          I'm also experimenting with using generative AI in different areas of my work, trying to understand how it can make me better at what I do (rather than replace me!).\n        </p>\n        <p>\n          Daily Hummingbird has grown out of that experimentation. I use ChatGPT to find me interesting articles from, well, just about anywhere; science to humanities, art to technology. It's designed to be a quick, cup-of-tea-sized encounter with something to inspire me at the start of the day. Through our conversations, ChatGPT learns what interests me and why, helping me curate the content. I'm now adding my own reflections, so you can see what's AI-generated and what's human.\n        </p>\n        <p>\n          Sometimes the connection to my work is obvious, sometimes it's unexpected, and sometimes it's just a bit of fun.\n        </p>\n        <p>\n          Over time, I'd like to invite other people to share their perspectives too. Looking at the same idea from different backgrounds can help cross-pollinate ideas (hence the hummingbird).\n        </p>\n        <p>\n          <em>\n            This is a personal curation project, not an official publication of my affiliated institutions.\n          </em>\n        </p>\n        <p>\n          <a href=\"archive.html\" class=\"pill\">\n            Explore the archive →\n          </a>\n        </p>\n      "+'</div>';
 const aboutParagraphs=[...aboutHtml.matchAll(/<p(?:\s[^>]*)?>[\s\S]*?<\/p>/g)].map(m=>m[0]);
 for(let i=0;i<aboutParagraphs.length;i+=2){pieces.push(page((i===0?'<h2>About Daily Hummingbird</h2>':'<div class="eyebrow">About · continued</div>')+'<div class="copy about-copy">'+aboutParagraphs.slice(i,i+2).join('')+'</div>','aboutpage'))}
 sectionPages.collaborators=pieces.length;
 pieces.push(page('<h2>Collaborators</h2><div class="copy"><p>Different people see different things in the same story. These are some of the people sharing their perspectives.</p></div>','people-intro'));
 const collaborators=collaboratorData.map(c=>({name:c.name,url:c.linkedin||'',img:c.image||'',note:(c.curator?'Curator & Collaborator':'Collaborator')+' · '+(c.country||''),desc:c.background||''}));
 for(let i=0;i<collaborators.length;i+=2){
  const cards=collaborators.slice(i,i+2).map(c=>'<div class="contributor-card"><div class="contributor-photo"><img src="'+link(c.img)+'" alt="Portrait of '+esc(c.name)+'" loading="lazy"></div><div class="contributor-details"><h3>'+esc(c.name)+'</h3><p class="contributor-note">'+esc(c.note.replace(/&amp;/g,'&'))+'</p><p>'+esc(c.desc)+'</p><a href="'+link(c.url)+'" target="_blank" rel="noopener noreferrer">Profile ↗</a></div></div>').join('');
  pieces.push(page('<div class="eyebrow">People and perspectives · '+String(Math.floor(i/2)+1).padStart(2,'0')+'</div><h2>Collaborators</h2><div class="contributor-pair">'+cards+'</div>','personpage contributor-pair-page'));
 }
 pieces.push(page('<div class="eyebrow">The end · For now</div><h2>Where might this idea lead?</h2><p>Every reflection is a different way of looking at the same discovery.</p><p><a href="archive.html">Explore the archive ↗</a></p><p>Return tomorrow for another discovery.</p>','endpage',true));
 return pieces;
}
function update(){
 if(!flip)return;
 current=flip.getCurrentPageIndex();const total=flip.getPageCount();
 label.textContent=current===0?'Cover · Open the notebook':(current===total-1?'Last page':('Page '+current+' of '+(total-2)));
 prev.disabled=current===0;next.disabled=current>=total-1;
 document.getElementById('journal-stage').classList.toggle('open-book',current>0);
 
}
let sheets=[],sheetIndex=0,turning=false;
function showSheet(){
 const stage=document.getElementById('journal-stage');
 const opened=sheetIndex>0;
 stage.classList.toggle('open-book',opened);
 stage.onclick=opened?null:()=>flip.flipNext();
 stage.style.cursor=opened?'default':'pointer';
 root.innerHTML='';
 const right=sheets[sheetIndex];
 const mobileSingle=window.matchMedia('(max-width:700px)').matches;
 const left=!mobileSingle&&opened&&sheetIndex>1?sheets[sheetIndex-1]:null;
 if(left){const holder=document.createElement('div');holder.className='static-leaf static-left';holder.innerHTML=left;root.appendChild(holder)}
 if(opened&&right){const holder=document.createElement('div');holder.className='static-leaf static-right';holder.innerHTML=right;root.appendChild(holder);holder.addEventListener('click',e=>{if(e.target.closest('a,button,.archive-entry,.copy,.archive-list'))return;flip.flipNext()})}
 const total=sheets.length;
 label.textContent=sheetIndex===0?'Cover · Open the notebook':(mobileSingle?'Page '+sheetIndex+' of '+(total-1):'Pages '+Math.max(1,sheetIndex-1)+'–'+sheetIndex+' of '+(total-1));
 prev.disabled=sheetIndex===0;next.disabled=sheetIndex>=total-1;
 root.querySelectorAll('[data-today]').forEach(el=>el.addEventListener('click',()=>turnTo(sectionPages.today,'next')));
 root.querySelectorAll('.archive-entry[data-entry-id]').forEach(el=>el.addEventListener('click',()=>{
  const item=all.find(y=>y.id===el.dataset.entryId);
  if(item){history.replaceState(null,'','?id='+encodeURIComponent(item.id));render(item);flip.flipNext()}
 }));
}
flip={
 getCurrentPageIndex:()=>sheetIndex,getPageCount:()=>sheets.length,
 flipNext:()=>turnTo(sheetIndex===0?1:Math.min(sheets.length-1,sheetIndex+(window.matchMedia('(max-width:700px)').matches?1:2)),'next'),
 flipPrev:()=>turnTo(sheetIndex<=1?0:Math.max(1,sheetIndex-(window.matchMedia('(max-width:700px)').matches?1:2)),'prev'),
 flip:(n)=>turnTo(Math.max(1,Math.min(sheets.length-1,n)),'next'),
 destroy:()=>{}
};
function turnTo(target,direction){
 if(turning||target<0||target>=sheets.length||target===sheetIndex)return;
 const current=root.querySelector('.static-right');
 // Temporarily avoid the rigid, oversized 3D overlay until spread geometry is stable.
 sheetIndex=target;showSheet();return;

 if(!current||sheetIndex===0||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  sheetIndex=target;showSheet();return;
 }
 turning=true;
 const forward=direction!=='prev';
 const oldHTML=sheets[sheetIndex],newHTML=sheets[target];
 sheetIndex=target;showSheet();
 const leaf=document.createElement('div');
 leaf.className='static-leaf static-right page-turn-sheet '+(forward?'turn-next':'turn-previous');
 leaf.setAttribute('aria-hidden','true');
 const front=forward?oldHTML:newHTML;
 const back=forward?newHTML:oldHTML;
 leaf.innerHTML='<div class="turn-face turn-front">'+front+'</div><div class="turn-face turn-backface">'+back+'</div>';
 // Match the actual rendered paper, not the nominal percentage-based geometry.
 const reference=root.querySelector('.static-right:not(.page-turn-sheet)');
 if(reference){
  const r=reference.getBoundingClientRect(),base=root.getBoundingClientRect();
  leaf.style.setProperty('left',(r.left-base.left)+'px','important');
  leaf.style.setProperty('top',(r.top-base.top)+'px','important');
  leaf.style.setProperty('width',r.width+'px','important');
  leaf.style.setProperty('height',r.height+'px','important');
 }
 root.appendChild(leaf);
 requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.classList.add('turn-active')));
 setTimeout(()=>{leaf.remove();turning=false},760);
}
function render(x){sheets=build(x);sheetIndex=0;turning=false;showSheet()}
document.querySelectorAll('.journal-tabs button').forEach(btn=>btn.addEventListener('click',()=>{if(!flip)return;const target=sectionPages[btn.dataset.section];if(target===undefined)return;const go=()=>{if(flip)flip.flip(target)};if(flip.getCurrentPageIndex()===0){flip.flipNext();setTimeout(go,850)}else go()}));
prev.addEventListener('click',e=>{e.stopPropagation();if(flip)flip.flipPrev()});
next.addEventListener('click',e=>{e.stopPropagation();if(flip)flip.flipNext()});
document.addEventListener('keydown',e=>{if(!flip||e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight')flip.flipNext();if(e.key==='ArrowLeft')flip.flipPrev()});

Promise.all([fetch('inspiration.json').then(r=>{if(!r.ok)throw Error('Could not load discoveries');return r.json()}),fetch('collaborators.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load collaborators');return r.json()})]).then(([data,collaborators])=>{
 collaboratorData=collaborators;
 all=data.slice().sort((a,b)=>b.date.localeCompare(a.date));
 const param=new URLSearchParams(location.search).get('id');const chosen=all.find(x=>x.id===param)||all[0];render(chosen);
}).catch(err=>{console.error(err);label.textContent='Unable to load discoveries';root.innerHTML='<p class="fallback-message">The discovery data could not be loaded. Please refresh the page.</p>'});
})();
</script>
</body></html>
