<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".009 .15" numOctaves="4" seed="12" stitchTiles="stitch" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
  <feComponentTransfer in="grey"><feFuncA type="linear" slope=".18"/></feComponentTransfer>
 </filter>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#c39970"/><stop offset=".48" stop-color="#d6ae83"/><stop offset="1" stop-color="#c49a74"/>
 </linearGradient>
 <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#fff6dc" stop-opacity=".26"/><stop offset=".52" stop-color="#f5e8c9" stop-opacity="0"/><stop offset="1" stop-color="#694429" stop-opacity=".24"/>
 </linearGradient>
 <pattern id="striae" width="1600" height="105" patternUnits="userSpaceOnUse">
  <path d="M0 4H1600 M0 12H1600 M0 29H1600 M0 42H1600 M0 61H1600 M0 64H1600 M0 80H1600 M0 98H1600" fill="none" stroke="#7b5333" stroke-opacity=".105" stroke-width="1.3"/>
  <path d="M0 16H1600 M0 33H1600 M0 55H1600 M0 91H1600" fill="none" stroke="#fff1cd" stroke-opacity=".23" stroke-width="1.7"/>
 </pattern>
</defs>
<rect width="1600" height="1000" fill="url(#wood)"/>
<rect width="1600" height="1000" fill="url(#striae)"/>
<g stroke="#825c3c" opacity=".28" stroke-width="2"><path d="M0 258H1600"/><path d="M0 602H1600"/><path d="M0 883H1600"/></g>
<g stroke="#f4d4a9" opacity=".4"><path d="M0 260H1600"/><path d="M0 604H1600"/><path d="M0 885H1600"/></g>
<rect width="1600" height="1000" filter="url(#grain)" opacity=".42"/>
<path d="M-200 300L300-200L535-200L-200 535Z M-200 735L735-200L860-200L-200 860Z" fill="#533f30" opacity=".12"/>
